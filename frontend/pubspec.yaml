version: 1.0.0+1
name: net_fence_ai
description: Net-Fence AI - Intelligent Network Intrusion Detection System. Advanced Wi-Fi threat detection using Isolation Forest ML with real-time Evil Twin protection.
publish_to: 'none'
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  google_fonts: ^5.0.0
  flutter_animate: ^4.0.0
  flutter_map: ^5.0.0
  latlong2: ^0.9.0
  http: ^1.6.0
  wifi_scan: ^0.4.0
  geolocator: ^10.0.0
  permission_handler: ^11.0.0
  flutter_local_notifications: ^17.2.3
  workmanager: ^0.9.0  # Updated from ^0.5.2 - fixes Kotlin compilation errors
  # geofence_service: ^3.0.0  # DISABLED: Package is discontinued
  # TODO: Replace with 'geofencing_api' package for future geofencing support
  geocoding: ^2.1.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
